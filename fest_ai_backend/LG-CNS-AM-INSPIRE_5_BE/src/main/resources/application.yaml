server:
  port: 8080

spring:
  application:
    name: LG-CNS-AM-INSPIRE_5_BE

  # mariadb settings
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/inspire
    username: root
    password: 1004


  ai:
    # Gemini를 OpenAI 호환 주소로 호출한다. 키는 .env의 OPEN_AI_KEY에 Gemini 키를 넣는다.
    # OpenAI로 되돌리려면 .env에서 OPEN_AI_BASE_URL=https://api.openai.com,
    # OPEN_AI_CHAT_PATH=/v1/chat/completions, OPEN_AI_EMBEDDING_PATH=/v1/embeddings 로 바꾼다.
    openai:
      api-key: ${OPEN_AI_KEY}
      base-url: ${OPEN_AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      chat:
        completions-path: ${OPEN_AI_CHAT_PATH:/chat/completions}
        options:
          model: ${OPEN_AI_MODEL:gemini-2.5-flash}
      embedding:
        embeddings-path: ${OPEN_AI_EMBEDDING_PATH:/embeddings}
        options:
          model: ${OPEN_AI_EMBEDDING_MODEL:gemini-embedding-001}

  jpa:
    hibernate:
      # create, create-drop, update, none
      ddl-auto: update

      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    # 콘솔 출력
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

  # 아직 사용안해서 주석처리
#  data:
#    redis:
#      host: localhost
#      port: 6379
#      password:
#      timeout: 6000ms

jwt:
    secret: ${JWT_SECRET_KEY}

# OPEN API
openapi:
    serviceKey: ${SERVICE_KEY}
    callbackUrl: ${CALLBACKURL}
    dataType: ${TYPE}